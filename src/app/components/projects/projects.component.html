<section id="projects" class="container work-section">
    <div class="section-heading">
        <h2>Selected work.</h2>
        <p>Production systems for sports, security, retail and enterprise mobility, plus the research behind them.</p>
    </div>

    <div class="project-grid">
        <article class="project-item" *ngFor="let project of projects; let first = first" [class.featured]="first">
            <div class="project-icon" aria-hidden="true"><i class="fas" [ngClass]="project.icon"></i></div>
            <h3 class="project-title-text">{{ project.title }}</h3>
            <p class="project-subtitle-text">{{ project.subtitle }}</p>
            <p class="project-desc-text">{{ project.description[0] }}</p>

            <details class="more">
                <summary>What I built</summary>
                <ul class="bullet-grid">
                    <li class="bullet-item" *ngFor="let bullet of project.description.slice(1)">{{ bullet }}</li>
                </ul>
            </details>

            <ul class="project-tags" aria-label="Technologies">
                <li class="tag" *ngFor="let t of project.tech">{{ t }}</li>
            </ul>

            <a *ngIf="project.link" class="store-link" [href]="project.link" target="_blank" rel="noopener">
                Get it on Google Play <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i>
            </a>
        </article>
    </div>
</section>
