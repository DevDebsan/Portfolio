<section id="projects" class="container work-section">
    <div class="section-heading">
        <span class="eyebrow">Work</span>
        <h2>Selected projects.</h2>
    </div>

    <div class="project-grid">
        <article class="project-item" *ngFor="let project of projects">
            <div class="project-icon" aria-hidden="true">
                <i class="fas" [ngClass]="project.icon"></i>
            </div>
            <h3 class="project-title-text">{{ project.title }}</h3>
            <span class="project-subtitle-text">{{ project.subtitle }}</span>

            <p class="project-desc-text">{{ project.description[0] }}</p>
            <ul class="bullet-grid">
                <li class="bullet-item" *ngFor="let bullet of project.description.slice(1)">{{ bullet }}</li>
            </ul>

            <div class="project-tags">
                <span class="tag" *ngFor="let t of project.tech">{{ t }}</span>
            </div>

            <button *ngIf="project.link" class="learn-more" (click)="openLink(project.link)">
                Learn more <i class="fas fa-chevron-right" aria-hidden="true"></i>
            </button>
        </article>
    </div>
</section>
