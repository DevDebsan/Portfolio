<section id="skills" class="proof-section grouped">
    <div class="container">
        <div class="section-heading">
            <h2>Skills.</h2>
            <p>From model training to deployment on the device in your hand.</p>
        </div>
        <dl class="skill-group">
            <div class="skill-row" *ngFor="let item of capabilities">
                <dt class="skill-category">{{ item.category }}</dt>
                <dd class="skill-list">{{ item.skills.join(' · ') }}</dd>
            </div>
        </dl>
    </div>
</section>
