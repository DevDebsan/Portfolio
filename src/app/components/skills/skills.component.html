<section id="skills" class="proof-section bg-light">
    <div class="container">
        <div class="section-heading">
            <span class="eyebrow">Skills</span>
            <h2>What I work with.</h2>
        </div>
        <div class="skills-grid">
            <article class="skill-block" *ngFor="let item of capabilities">
                <h3 class="skill-category">{{ item.category }}</h3>
                <ul class="skill-list">
                    <li *ngFor="let skill of item.skills">{{ skill }}</li>
                </ul>
            </article>
        </div>
    </div>
</section>
